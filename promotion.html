<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kids Promotions — BJJ Attendance</title>
    <link rel="stylesheet" href="styles.css?v=21">
  </head>
  <body class="promotion-page">
    <main class="container">
      <header class="header">
        <h1>Kids Promotions</h1>
        <p class="sub">Schedule and record belt promotions</p>
        <div id="global-nav"></div>
      </header>

      <section class="controls">
        <label>Filter Rank
          <select id="rankFilter">
            <option value="">All ranks</option>
          </select>
        </label>
        <button id="exportJson" class="btn">Export JSON</button>
        <button id="exportCsv" class="btn">Export CSV</button>
        <button id="printBtn" class="btn">Print</button>
      </section>

      <div class="promo-row header">
        <div class="col name">Name</div>
        <div class="col current">Current Rank</div>
        <div class="col stats">Attendance</div>
        <div class="col belt">Belt Size</div>
        <div class="col target">Target Rank</div>
        <div class="col stock">In Stock</div>
        <div class="col confirmed">Confirmed</div>
        <div class="col action">Action</div>
      </div>
      <section id="promoList"></section>

      <div class="note muted">Tip: choose a target rank, set belt size and mark "In Stock" before applying.</div>

    </main>

    <script type="module" src="auth-guard.js"></script>
    <script type="module" src="nav.js?v=12"></script>
      <script type="module" src="promotion.js?v=20"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Promotions — Black Lotus BJJ</title>
    <link rel="stylesheet" href="styles.css?v=107" />
  </head>
  <body class="attendance-page promotion-workflow-page">
    <main class="container">
      <header class="attendance-header">
        <div class="attendance-brand"><img src="assets/Copilot_20260913_133023.png" alt="Black Lotus BJJ" /><h1>Promotions</h1></div>
        <div id="global-nav"></div>
      </header>
      <button id="promotionFiltersToggle" class="mobile-filter-toggle" type="button" aria-expanded="false" aria-controls="promotionFilters">Filters</button>
      <section id="promotionFilters" class="student-info-controls promotion-filters" aria-label="Promotion filters">
        <label>Search<input id="promotionSearch" type="search" placeholder="Student name" /></label>
        <label>Type<select id="promotionType"><option value="all">All types</option><option value="child">Child</option><option value="adult">Adult</option></select></label>
        <label>Rank<select id="promotionRank"><option value="">All ranks</option></select></label>
        <label>Attendance<select id="promotionAttendance"><option value="all">All attendance</option><option value="none">No attendance</option><option value="high">75% or higher</option><option value="low">Below 50%</option></select></label>
        <label>Staged<select id="promotionStaged"><option value="all">All students</option><option value="staged">Staged</option><option value="unstaged">Not staged</option></select></label>
        <label>Sort<select id="promotionSort"><option value="name">Name</option><option value="current">Current rank</option><option value="target">Target rank</option><option value="date">Last promoted</option></select></label>
        <button id="clearStaged" class="btn cancel" type="button">Clear all staged</button>
      </section>
      <div id="promotionStatus" class="muted" role="status">Ready</div>
      <section class="promotion-workflow-list" aria-label="Student promotions">
        <div class="promotion-workflow-header"><span>Name</span><span>Current rank</span><span>Target rank</span><span>Status</span><span>Stage</span></div>
        <div id="promotionWorkflowList"></div>
      </section>
    </main>
    <script type="module" src="auth-guard.js"></script>
    <script type="module" src="nav.js?v=20"></script>
    <script type="module" src="promotion.js?v=45"></script>
  </body>
</html>

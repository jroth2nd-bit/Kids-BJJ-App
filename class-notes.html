<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kids Class Notes — BJJ Attendance</title>
    <link rel="stylesheet" href="styles.css?v=19" />
  </head>
  <body class="kids-notes-page">
    <main class="container">
      <header class="header">
        <h1>Kids Class Notes</h1>
        <p class="sub">Plan and review Kids lessons by class and coach</p>
        <div id="global-nav"></div>
      </header>

      <section class="notes-layout">
        <aside class="notes-sidebar">
          <div class="notes-sidebar-head">
            <h3>Class History</h3>
            <button id="newNote" class="btn">New</button>
          </div>
          <ul id="notesHistory" class="notes-history"></ul>
        </aside>

        <section class="notes-editor-card">
          <div class="notes-meta-row">
            <label for="notesDate">Date</label>
            <input id="notesDate" type="date" />
            <label for="notesClass">Class</label>
            <input id="notesClass" type="text" value="Kids Class" />
            <label for="notesCoach">Coach</label>
            <input id="notesCoach" type="text" list="kidsCoachOptions" placeholder="Coach name" />
            <datalist id="kidsCoachOptions"></datalist>
            <label for="notesTitle">Lesson Title</label>
            <input id="notesTitle" type="text" placeholder="Armbar from Mount" />
          </div>

          <div class="notes-toolbar" id="notesToolbar" role="toolbar" aria-label="Rich text formatting toolbar">
            <button type="button" class="btn" data-cmd="bold"><strong>B</strong></button>
            <button type="button" class="btn" data-cmd="italic"><em>I</em></button>
            <button type="button" class="btn" data-cmd="underline"><u>U</u></button>
            <button type="button" class="btn" data-cmd="insertUnorderedList">Bullets</button>
            <button type="button" class="btn" data-cmd="insertOrderedList">Numbered</button>
            <button type="button" class="btn" data-cmd="formatBlock" data-value="h3">H3</button>
            <button type="button" class="btn" data-cmd="formatBlock" data-value="p">Paragraph</button>
            <button type="button" class="btn" data-cmd="removeFormat">Clear</button>
          </div>

          <div id="notesEditor" class="rich-editor" contenteditable="true" aria-label="Class notes rich text editor"></div>

          <div class="notes-actions-row">
            <button id="saveNote" class="btn save">Save</button>
            <button id="copyPrevious" class="btn">Copy Previous Lesson</button>
            <button id="deleteNote" class="btn cancel">Delete This Date</button>
            <button id="exportNotesJson" class="btn">Export JSON</button>
            <button id="exportNotesCsv" class="btn">Export CSV</button>
            <span id="notesStatus" class="muted">Ready</span>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="auth-guard.js"></script>
    <script type="module" src="nav.js?v=12"></script>
    <script type="module" src="kids-class-notes.js?v=2"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Adult Attendance — BJJ Attendance</title>
    <link rel="stylesheet" href="styles.css?v=95" />
  </head>
  <body class="attendance-page adult-attendance-page">
    <main class="container">
      <header class="attendance-header">
        <div class="attendance-brand"><img src="assets/Copilot_20260913_133023.png" alt="Black Lotus BJJ" /><h1>Adult Attendance</h1></div>
        <div id="global-nav"></div>
        <button id="adultAddStudentToggle" class="attendance-primary" type="button">Add</button>
      </header>
      <section class="attendance-controls-row adult-attendance-controls"><label class="attendance-date" for="adultDatePicker"><span aria-hidden="true">&#128197;</span><span class="sr-only">Attendance date</span><input id="adultDatePicker" type="date" /></label></section>
      <form id="adultAddStudentForm" class="add-student attendance-add-form" autocomplete="off" hidden>
        <div><label for="adultFirstName">First name</label>
          <input id="adultFirstName" name="firstName" placeholder="First name" required />
        </div>
        <div><label for="adultLastName">Last name</label>
          <input id="adultLastName" name="lastName" placeholder="Last name" required />
        </div>
        <button class="attendance-primary" type="submit">Add adult</button>
      </form>
      <section class="attendance-section">
        <div class="attendance-section-heading"><div><p class="eyebrow">Adult program</p><h2>Roster</h2></div><p id="adultDayStatus" class="muted"></p></div>
        <div class="attendance-headers"><button class="col first attendance-sort" type="button" data-sort="firstName">First name</button><button class="col last attendance-sort" type="button" data-sort="lastName">Last name</button><div class="col present">Present</div><div class="col edit">Edit</div><div class="col inactive">Deactivate</div></div>
        <ul id="adultStudentsList" class="students-list"></ul>
      </section>
      <section class="inactive-section"><h3>Inactive Adults</h3><ul id="adultInactiveList" class="inactive-list"></ul></section>
      <footer class="footer"><small>Data syncs with the academy account.</small></footer>
    </main>
    <script type="module" src="auth-guard.js"></script>
    <script type="module" src="nav.js?v=20"></script>
    <script type="module" src="adult-ui.js?v=15"></script>
  </body>
</html>
